name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传安装包的 Release tag（如 v1.0.0）'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      - name: 打包 DMG
        run: |
          hdiutil create -volname "replaim" \
            -srcfolder "build/macos/Build/Products/Release/replaim.app" \
            -ov -format UDZO "replaim-${{ inputs.tag || github.ref_name }}-macos.dmg"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: replaim-*-macos.dmg
          fail_on_unmatched_files: true

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: 打包便携版 zip
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath "replaim-${{ inputs.tag || github.ref_name }}-windows-x64.zip"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: replaim-*-windows-x64.zip
          fail_on_unmatched_files: true
