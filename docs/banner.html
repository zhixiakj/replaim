<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:640px; overflow:hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0B1220 0%, #10263F 55%, #0E3A5C 100%);
    color:#fff; position:relative;
  }
  .grid {
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,.055) 1.4px, transparent 1.4px);
    background-size:34px 34px;
  }
  .glow {
    position:absolute; right:-180px; top:-180px; width:560px; height:560px; border-radius:50%;
    background: radial-gradient(circle, rgba(56,130,246,.28), transparent 65%);
  }
  .wrap { position:relative; height:100%; display:flex; flex-direction:column; justify-content:center; padding:0 88px; }
  .row { display:flex; align-items:center; gap:40px; }
  .icon { width:148px; height:148px; border-radius:34px; box-shadow:0 24px 70px rgba(0,0,0,.55); }
  h1 { font-size:96px; font-weight:800; letter-spacing:-2.5px; line-height:1.05; }
  .sub { font-size:33px; color:#9FC3E8; margin-top:16px; font-weight:600; letter-spacing:.5px; }
  .chips { display:flex; gap:18px; margin-top:56px; }
  .chip {
    font-size:26px; font-weight:600; padding:13px 28px; border-radius:999px;
    background:rgba(56,130,246,.16); border:1px solid rgba(120,170,255,.38); color:#CFE4FF;
    white-space:nowrap;
  }
  .foot { position:absolute; left:88px; bottom:42px; font-size:23px; color:#7E9CC0; font-weight:500; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="row">
      <img class="icon" src="../assets/icon.png">
      <div>
        <h1>Replaim</h1>
        <div class="sub">跨境电商客服邮件 Copilot · 中文操作台，英文产出</div>
      </div>
    </div>
    <div class="chips">
      <div class="chip">免费开源 Apache-2.0</div>
      <div class="chip">数据全本地</div>
      <div class="chip">自带 API Key 无订阅</div>
      <div class="chip">学你的回信风格</div>
    </div>
    <div class="foot">github.com/zhixiakj/replaim · macOS &amp; Windows · 它起草，绝不代发</div>
  </div>
</body>
</html>
